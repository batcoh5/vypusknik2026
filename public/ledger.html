<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реестр голосов — Выпускник Краснообска 2026</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="preload" href="/fonts/geist-cyrillic-57c931.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/page-ledger.js"></script>
</head>
<body>
  <main>
    <div class="container">
      <div class="page-head" data-reveal>
        <div class="eyebrow" id="ledger-election"><span class="sk badge-sk"></span></div>
        <h1>Открытый реестр</h1>
        <p>Каждый принятый бюллетень записывается в цепочку блоков: блок хранит хеш предыдущего, поэтому изменить или удалить запись незаметно нельзя. Бюллетени зашифрованы и не содержат данных об избирателях.</p>
      </div>
      <div id="ledger-root" class="stack">
        <div class="stats"><div class="stat"><div class="sk sk--title"></div></div><div class="stat"><div class="sk sk--title"></div></div><div class="stat"><div class="sk sk--title"></div></div></div>
        <div class="card card--pad"><div class="sk sk--block"></div><div class="sk sk--block"></div><div class="sk sk--block"></div></div>
      </div>
    </div>
  </main>
</body>
</html>
