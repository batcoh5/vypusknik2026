<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверить голос — Выпускник 2026</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/page-verify.js"></script>
</head>
<body>
  <main>
    <div class="container stack">
      <div class="breadcrumbs"><a href="/">Главная</a> → Проверить голос</div>
      <section class="card">
        <h1>Проверить голос</h1>
        <p class="muted">Введите номер квитанции, полученной после голосования, или загрузите файл квитанции. Проверка выполняется в вашем браузере.</p>
        <form class="search-row" id="verify-form">
          <input class="input input--mono" id="receipt-input" name="receipt" placeholder="Номер квитанции — 64 символа" autocomplete="off" spellcheck="false" maxlength="64">
          <button class="btn btn--primary" type="submit">Проверить</button>
        </form>
        <div class="actions">
          <label class="btn btn--link">
            <input type="file" id="receipt-file" accept="application/json,.json" class="hidden">
            Загрузить файл квитанции
          </label>
          <button class="btn btn--link hidden" id="use-saved" type="button">Использовать квитанцию с этого устройства</button>
        </div>
      </section>
      <section id="result"></section>
    </div>
  </main>
</body>
</html>
