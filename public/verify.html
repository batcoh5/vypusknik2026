<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверить голос — Выпускник Краснообска 2026</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="preload" href="/fonts/geist-cyrillic-57c931.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/page-verify.js"></script>
</head>
<body>
  <main>
    <div class="container">
      <div class="page-head" data-reveal>
        <div class="eyebrow">Квитанция</div>
        <h1>Проверить голос</h1>
        <p>Введите номер квитанции, полученной после голосования, или загрузите файл квитанции. Все проверки выполняются прямо в вашем браузере.</p>
      </div>
      <div class="card card--pad" data-reveal data-d="80">
        <form class="row" id="verify-form">
          <input class="input input--mono" id="receipt-input" placeholder="Номер квитанции — 64 символа" autocomplete="off" spellcheck="false" maxlength="64" aria-label="Номер квитанции">
          <button class="btn btn--brand" type="submit" id="verify-btn">Проверить</button>
        </form>
        <div class="actions">
          <label class="btn btn--glass btn--sm">
            <input type="file" id="receipt-file" accept="application/json,.json" class="sr-only">
            <span id="upload-icon"></span> Загрузить файл квитанции
          </label>
          <span id="saved"></span>
        </div>
      </div>
      <section id="result" class="top-gap-sm"></section>
    </div>
  </main>
</body>
</html>
