<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосование — Выпускник Краснообска 2026</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="preload" href="/fonts/geist-cyrillic-57c931.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/page-vote.js"></script>
</head>
<body>
  <main>
    <div class="container">
      <div class="page-head" data-reveal>
        <div class="eyebrow" id="vote-status"><span class="sk badge-sk"></span></div>
        <h1 id="vote-title">Голосование</h1>
      </div>
      <div class="grid grid--main">
        <div class="card card--pad" data-reveal data-d="80">
          <div class="stepper" id="stepper"></div>
          <div id="step">
            <div class="stack"><div class="sk sk--title"></div><div class="sk sk--line"></div><div class="sk sk--line sk--short"></div><div class="sk sk--block"></div></div>
          </div>
        </div>
        <aside class="card spot" data-reveal data-d="160">
          <h3>Ваш голос защищён</h3>
          <ul class="checks top-gap-sm" id="aside-checks"></ul>
          <p class="small muted top-gap-sm">Не закрывайте страницу, пока не получите квитанцию.</p>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
