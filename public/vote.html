<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосование — Выпускник 2026</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/page-vote.js"></script>
</head>
<body>
  <main>
    <div class="container">
      <div class="breadcrumbs"><a href="/">Главная</a> → Голосование</div>
      <div class="grid grid--main">
        <div>
          <div class="card">
            <div class="stepper" id="stepper"></div>
            <div id="step"><div class="spinner" aria-label="Загрузка"></div></div>
          </div>
        </div>
        <aside class="card">
          <h3>Ваш голос защищён</h3>
          <ul class="checks small">
            <li class="ok"><span class="ci">✓</span><span>Бюллетень выдаётся один раз</span></li>
            <li class="ok"><span class="ci">✓</span><span>Слепая подпись комиссии — голос нельзя связать с вами</span></li>
            <li class="ok"><span class="ci">✓</span><span>Шифрование в браузере до отправки</span></li>
            <li class="ok"><span class="ci">✓</span><span>Запись в открытый реестр с квитанцией</span></li>
          </ul>
          <p class="small muted">Не закрывайте страницу, пока не получите квитанцию.</p>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
